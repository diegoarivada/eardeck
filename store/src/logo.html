<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EarDeck Store logo</title>
<style>
  @font-face { font-family: Inter; src: url(../../ui/fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6vh;
    font-family: Inter, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(70vmax 60vmax at 80% 15%, rgba(10, 132, 255, .6), transparent 60%),
      radial-gradient(60vmax 50vmax at 10% 100%, rgba(191, 90, 242, .45), transparent 62%),
      linear-gradient(160deg, #0b0d17 0%, #10162b 55%, #0c0f1d 100%);
  }
  img { width: 52vmin; height: 52vmin; filter: drop-shadow(0 3vmin 6vmin rgba(0, 0, 0, .45)); }
  .box img { width: 58vmin; height: 58vmin; }
  .box h1 { display: none; }
  h1 { font-size: 15vw; font-weight: 700; letter-spacing: -.035em; }
  p { font-size: 4vw; color: rgba(235, 235, 245, .7); margin-top: -4vh; }
  .box p { display: none; }
</style>
</head>
<body>
  <img src="icon.svg" alt="">
  <h1>EarDeck</h1>
  <p>An AirPods companion for Windows</p>
<script src="logo.js"></script>
</body>
</html>
