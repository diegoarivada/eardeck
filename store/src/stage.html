<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EarDeck Store shot</title>
<style>
  @font-face { font-family: Inter; src: url(../../ui/fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1366px; height: 768px; overflow: hidden; }
  body {
    font-family: Inter, "Segoe UI Variable", sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 600px at 82% 30%, rgba(10, 132, 255, .55), transparent 60%),
      radial-gradient(700px 520px at 100% 100%, rgba(191, 90, 242, .45), transparent 62%),
      radial-gradient(800px 600px at 0% 100%, rgba(255, 69, 58, .22), transparent 60%),
      linear-gradient(160deg, #0b0d17 0%, #10162b 55%, #0c0f1d 100%);
  }
  .copy { position: absolute; left: 96px; top: 50%; transform: translateY(-58%); width: 600px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: rgba(245, 245, 247, .85); }
  .brand img { width: 40px; height: 40px; }
  h1 { margin-top: 28px; font-size: 56px; line-height: 1.06; font-weight: 700; letter-spacing: -.035em; }
  p { margin-top: 20px; font-size: 22px; line-height: 1.45; color: rgba(235, 235, 245, .7); max-width: 520px; }

  /* The popup sits above the tray, like it does on a real desktop. */
  .popup {
    position: absolute; right: 24px; bottom: 60px; width: 340px; height: 560px; border-radius: 10px; overflow: hidden;
    backdrop-filter: blur(40px) saturate(1.6); background: rgba(32, 32, 38, .35);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
  }
  .popup iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }

  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 14px;
    padding: 0 18px; background: rgba(28, 28, 34, .82); backdrop-filter: blur(30px); border-top: 1px solid rgba(255, 255, 255, .06);
    font: 12px "Segoe UI Variable", "Segoe UI", sans-serif; color: rgba(255, 255, 255, .9);
  }
  .tray { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); }
  .tray img { width: 18px; height: 18px; }
  .clock { text-align: right; line-height: 1.35; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="icon.svg" alt="">EarDeck</div>
    <h1 id="title"></h1>
    <p id="text"></p>
  </div>
  <div class="popup"><iframe id="frame" title="EarDeck"></iframe></div>
  <div class="taskbar">
    <span class="tray"><img src="icon.svg" alt=""></span>
    <span class="clock">9:41 AM<br>11/5/2026</span>
  </div>
<script src="stage.js"></script>
</body>
</html>
